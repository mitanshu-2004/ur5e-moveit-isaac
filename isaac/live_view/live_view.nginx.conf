worker_processes 1;
pid /tmp/ur5e-video-nginx.pid;
error_log /tmp/ur5e-video-nginx-error.log;
events { worker_connections 128; }
http {
  client_body_temp_path /tmp/ur5e-video-body;
  proxy_temp_path /tmp/ur5e-video-proxy;
  fastcgi_temp_path /tmp/ur5e-video-fastcgi;
  uwsgi_temp_path /tmp/ur5e-video-uwsgi;
  scgi_temp_path /tmp/ur5e-video-scgi;
  access_log off;
  server {
    listen 127.0.0.1:8080;
    location = / { return 302 /stream.html?src=screen&mode=mse; }
    location ~ ^/(stream\.html|video-stream\.js|video-rtc\.js)$ {
      proxy_set_header Accept-Encoding "";
      sub_filter_types application/javascript text/javascript;
      # aim for 0.5 s buffered; raise the 0.5 in gap / 0.5 if playback keeps stalling
      sub_filter 'this.video.playbackRate = gap > 0.1 ? gap : 0.1;' 'this.video.playbackRate = Math.min(2, Math.max(0.5, gap / 0.5));';
      add_header Cache-Control "no-store" always;
      proxy_pass http://127.0.0.1:1984;
    }
    location = /api/ws {
      set $args "src=screen";
      proxy_pass http://127.0.0.1:1984;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection "upgrade";
      proxy_buffering off;
      proxy_read_timeout 1h;
    }
    location / { return 404; }
  }
}
